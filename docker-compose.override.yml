services:
  nginx:
    profiles:
      - with-nginx

  backend:
    command: python3 manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.develop
    volumes:
      - .:/app

  db:
    profiles:
      - with-postgres
