{% load i18n site_content %}
<section class="section section--dark lead-section" id="lead-form">
  <div class="container">
    <div class="section__head reveal">
      <span class="section__eyebrow">{% block_plain 'site' 'lead_eyebrow' %}</span>
      <h2 class="section__title" id="lead-section-title">{% block_plain 'site' 'lead_title' %}</h2>
      <p class="section__lead" id="lead-section-lead">{% block_plain 'site' 'lead_lead' %}</p>
    </div>
    <div class="calculator-card calculator-card--lead reveal" id="lead-form-slot">
      {% include "leads/_form.html" %}
    </div>
  </div>
</section>
