{% load static i18n %}
<div class="routes-map" data-routes-map data-filter="all" role="img"
  aria-label="{% trans 'Супутникова карта коридорів Європа — Азія' %}">
  <picture>
    <source type="image/webp" srcset="{% static 'media/routes-map-satellite.webp' %}">
    <img class="routes-map__base" src="{% static 'media/routes-map-satellite.png' %}" alt="" width="1920" height="980"
      loading="lazy" decoding="async">
  </picture>

    <defs>
      <linearGradient id="routes-grad-eu" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7DD3FC"/>
        <stop offset="100%" stop-color="#F8FAFC"/>
      </linearGradient>
      <linearGradient id="routes-grad-as" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="100%" stop-color="#FDBA74"/>
      </linearGradient>
      <filter id="routes-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <marker id="routes-arrow-eu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
        orient="auto-start-reverse">
        <path d="M0,1.2 L9,5 L0,8.8 Z" fill="#E0F2FE"/>
      </marker>
      <marker id="routes-arrow-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
        orient="auto-start-reverse">
        <path d="M0,1.2 L9,5 L0,8.8 Z" fill="#FDBA74"/>
      </marker>
    </defs>
