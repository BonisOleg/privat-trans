{% extends "base.html" %}
{% load i18n %}

{% block content %}
<header class="page-header">
  <div class="container">
    <nav class="breadcrumbs reveal">
      <a href="{% url 'pages:home' %}">{% trans "Головна" %}</a> /
      <a href="{% url 'services:list' %}">{% trans "Послуги" %}</a> /
      {{ service.title }}
    </nav>
    <span class="page-header__eyebrow reveal">{% trans "Послуга" %}</span>
    <h1 class="page-title reveal">{{ service.title }}</h1>
    <div class="page-lead reveal">{{ service.teaser|safe }}</div>
  </div>
</header>
<section class="section atmosphere--arcs">
  <div class="container service-hero">
    <div class="service-hero__body reveal">
      {{ service.body|safe }}
    </div>
    <div class="service-hero__card reveal reveal--right" id="lead-form-slot">
      {% include "leads/_form.html" %}
    </div>
  </div>
</section>
{% endblock %}
